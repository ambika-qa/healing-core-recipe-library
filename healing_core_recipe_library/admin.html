
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healing Core | Recipe Admin</title>
<style>
body{margin:0;background:#f7f5ef;color:#354b3d;font-family:Arial,sans-serif}
main{max-width:850px;margin:35px auto;padding:20px}
.card{background:white;padding:24px;border-radius:14px;margin:18px 0}
h1,h2{color:#405b46}
input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border:1px solid #d9dfd7;border-radius:7px;font:inherit}
textarea{min-height:90px}
button{background:#526b56;color:white;border:0;cursor:pointer}
.secondary{background:#e8eee6;color:#354b3d}
.hidden{display:none}
.recipe{padding:12px 0;border-bottom:1px solid #eee}
small{color:#6c786e}
#message{white-space:pre-wrap;color:#526b56}
</style>
</head>
<body>
<main>
<h1>Healing Core</h1>
<p>Recipe Library Admin</p>

<section id="login" class="card">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Log in</button>
<p id="loginMessage"></p>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<h2>Add a Recipe</h2>
<form id="recipeForm">
<input id="name" placeholder="Recipe name" required>
<textarea id="description" placeholder="Short description"></textarea>
<input id="categories" placeholder="Categories, separated by commas">
<textarea id="ingredients" placeholder="Ingredients — one per line" required></textarea>
<textarea id="steps" placeholder="Preparation steps — one per line" required></textarea>
<input id="prep" type="number" min="0" placeholder="Preparation time in minutes">
<input id="image" type="url" placeholder="Food photo URL (optional)">
<label><input id="published" type="checkbox" style="width:auto"> Publish recipe immediately</label>
<button type="submit">Save Recipe</button>
</form>
<p id="message"></p>
</div>

<div class="card">
<h2>Your Recipes</h2>
<div id="recipes">Loading recipes...</div>
</div>
<button id="logout" class="secondary">Log out</button>
</section>
</main>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
'https://obfivpchpetkeibocflf.supabase.co',
'sb_publishable_h-It4wWp-nVF8zcTaSt0Fw_zHhNnTqn'
);

const adminId='8ff3fbca-4bd8-49d3-a3d2-35434fd56304';
const $=id=>document.getElementById(id);

function showDashboard(user){
  if(!user || user.id!==adminId){
    $('login').classList.remove('hidden');
    $('dashboard').classList.add('hidden');
    return;
  }
  $('login').classList.add('hidden');
  $('dashboard').classList.remove('hidden');
  loadRecipes();
}

$('loginBtn').addEventListener('click',async()=>{
  $('loginMessage').textContent='Signing in...';
  const {data,error}=await supabase.auth.signInWithPassword({
    email:$('email').value.trim(),
    password:$('password').value
  });
  if(error){$('loginMessage').textContent=error.message;return;}
  if(data.user.id!==adminId){
    await supabase.auth.signOut();
    $('loginMessage').textContent='Not authorized.';
    return;
  }
  $('loginMessage').textContent='';
  showDashboard(data.user);
});

async function loadRecipes(){
  $('recipes').textContent='Loading...';
  const {data,error}=await supabase.from('recipes')
    .select('*').order('created_at',{ascending:false});
  if(error){$('recipes').textContent=error.message;return;}
  if(!data.length){$('recipes').textContent='No recipes yet.';return;}
  $('recipes').replaceChildren();
  data.forEach(recipe=>{
    const item=document.createElement('div');
    item.className='recipe';
    const title=document.createElement('strong');
    title.textContent=recipe.name;
    const status=document.createElement('small');
    status.textContent=' — '+(recipe.published?'Published':'Draft');
    item.append(title,status);
    $('recipes').append(item);
  });
}

$('recipeForm').addEventListener('submit',async(event)=>{
  event.preventDefault();
  $('message').textContent='Saving recipe...';
  const {data:{user}}=await supabase.auth.getUser();
  if(!user || user.id!==adminId){
    $('message').textContent='Please log in again.';
    return;
  }
  const recipe={
    name:$('name').value.trim(),
    description:$('description').value.trim(),
    categories:$('categories').value.split(',').map(x=>x.trim()).filter(Boolean),
    ingredients:$('ingredients').value.split('\n').map(x=>x.trim()).filter(Boolean),
    steps:$('steps').value.split('\n').map(x=>x.trim()).filter(Boolean),
    prep_minutes:$('prep').value?Number($('prep').value):null,
    image_url:$('image').value.trim()||null,
    published:$('published').checked
  };
  const {error}=await supabase.from('recipes').insert(recipe);
  if(error){$('message').textContent='Could not save: '+error.message;return;}
  $('message').textContent='Recipe saved successfully!';
  $('recipeForm').reset();
  loadRecipes();
});

$('logout').addEventListener('click',async()=>{
  await supabase.auth.signOut();
  $('dashboard').classList.add('hidden');
  $('login').classList.remove('hidden');
});

const {data:{session}}=await supabase.auth.getSession();
if(session) showDashboard(session.user);
</script>
</body>
</html>
