
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Healing Core | Admin Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f5ef;
      font-family: Arial, sans-serif;
      color: #354b3d;
    }
    .login {
      background: white;
      padding: 36px;
      border-radius: 16px;
      width: min(340px, calc(100% - 64px));
      box-shadow: 0 8px 30px #0000000c;
    }
    h1 { font-size: 25px; margin-bottom: 8px; }
    p { color: #69756b; line-height: 1.5; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 8px;
      font-size: 15px;
    }
    input { border: 1px solid #d9dfd7; }
    button {
      border: 0;
      background: #526b56;
      color: white;
      cursor: pointer;
    }
    #message { font-size: 14px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="login">
    <h1>Healing Core</h1>
    <p>Private recipe library administration</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Email address" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
    <p id="message" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://obfivpchpetkeibocflf.supabase.co',
      'sb_publishable_h-It4wWp-nVF8zcTaSt0Fw_zHhNnTqn'
    );

    const allowedAdmin =
      '8ff3fbca-4bd8-49d3-a3d2-35434fd56304';

    document.getElementById('loginForm')
      .addEventListener('submit', async (event) => {
        event.preventDefault();

        const message = document.getElementById('message');
        message.textContent = 'Signing in...';

        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        if (error) {
          message.textContent = error.message;
          return;
        }

        if (data.user.id !== allowedAdmin) {
          await supabase.auth.signOut();
          message.textContent = 'This account is not authorized.';
          return;
        }

        message.textContent = 'Login successful! Admin access confirmed.';
      });
  </script>
</body>
</html>
